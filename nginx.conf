# Typing Battle — Nginx Production Config
#
# This config:
# 1. Serves static files (HTML/CSS/JS) from /public
# 2. Proxies /ws to the Ratchet WebSocket server (wss:// -> ws://)
#
# Usage:
#   sudo ln -s /path/to/game_klik/nginx.conf /etc/nginx/sites-enabled/typing-battle
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # SSL certificates (use Let's Encrypt / certbot)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Static files
    root /var/www/typing-battle/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy — connect wss://yourdomain.com/ws
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
